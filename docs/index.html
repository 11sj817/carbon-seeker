<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f8a5f">
<meta name="description" content="碳寻（Carbon Seeker）：企业碳减排管理的碳应用平台。在线计算个人碳足迹、建立企业碳账本（Scope 1/2/3）、用绿色积分兑换螺旋藻与海洋垃圾清理。因子与公式全部公开。">
<meta name="color-scheme" content="light dark">
<title>碳寻 · 企业碳减排管理的碳应用平台 | Carbon Seeker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%230f8a5f'/%3E%3Cg fill='%23fff'%3E%3Cellipse cx='20' cy='13' rx='4' ry='5'/%3E%3Cellipse cx='27.6' cy='26' rx='4' ry='5' transform='rotate(120 27.6 26)'/%3E%3Cellipse cx='12.4' cy='26' rx='4' ry='5' transform='rotate(240 12.4 26)'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* 碳寻 · Carbon Seeker —— 主题与版式
   设计语言参照 DAC Workbench：左侧固定模块栏 + 顶部状态头 + 证据化内容面板。
   不引入任何外部字体、图标库或框架。 */

:root{
  color-scheme:light;
  --bg:#eef5f0;
  --panel:#ffffff;
  --panel2:#f5faf6;
  --line:#d7e5db;
  --line-soft:#e6efe9;
  --txt:#14261c;
  --dim:#5b7367;
  --acc:#0f8a5f;
  --acc-ink:#0b6a4a;
  --acc2:#0d7d78;
  --ok:#0f7a4d;
  --warn:#8a6412;
  --bad:#b03a46;
  --gold:#9a7a0c;
  --rail:#0e2a20;
  --rail-txt:#a9c4b6;
  --rail-dim:#7d9b8c;
  --rail-on:#12855a;
  --row-even:#f7fbf8;
  --row-hover:#eaf6ef;
  --chip:#eef7f1;
  --shadow:0 6px 22px #0f2a1e12;
  --c1:#12855a; --c2:#0d7d78; --c3:#c98a2b; --c4:#54789a; --c5:#8a6fae; --c6:#93a53f;
  --header:70px; --rail-w:220px;
}
body.dark{
  color-scheme:dark;
  --bg:#0a1310;
  --panel:#111e19;
  --panel2:#16261f;
  --line:#273f33;
  --line-soft:#1e332a;
  --txt:#e3efe7;
  --dim:#93a99c;
  --acc:#3fd092;
  --acc-ink:#8ce6bd;
  --acc2:#38c6ba;
  --ok:#4ed7a1;
  --warn:#e0b155;
  --bad:#f08a92;
  --gold:#e0bb4a;
  --rail:#07110c;
  --rail-txt:#a4c0b1;
  --rail-dim:#6f8e7d;
  --rail-on:#1a9c6a;
  --row-even:#14231d;
  --row-hover:#1b3227;
  --chip:#17291f;
  --shadow:0 6px 22px #00000055;
  --c1:#4ed7a1; --c2:#48c8bd; --c3:#e0b155; --c4:#7fa6c9; --c5:#b9a1e0; --c6:#b6c65a;
}

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header) + 18px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.7 "Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  font-variant-numeric:tabular-nums;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:0;z-index:99;background:var(--acc);color:#fff;padding:10px 16px;border-radius:0 0 8px 0}
.skip:focus{left:0}
.mono{font-family:"Cascadia Code",Consolas,"SFMono-Regular",monospace;font-variant-ligatures:none}

/* ---------- 顶部 ---------- */
.app-header{
  position:sticky;top:0;z-index:50;height:var(--header);
  display:flex;align-items:center;gap:18px;padding:0 22px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center}
.brand-mark svg{width:38px;height:38px;display:block}
.brand-text{min-width:0}
.brand-text h1{margin:0;font:650 18px/1.15 Bahnschrift,"Segoe UI",sans-serif;letter-spacing:.3px;white-space:nowrap}
.brand-text small{display:block;margin-top:3px;color:var(--dim);font:10px/1 "Cascadia Code",Consolas,monospace;letter-spacing:1.5px;text-transform:uppercase}
.header-steps{display:flex;align-items:center;gap:6px;margin-left:8px;flex:1;min-width:0;overflow:hidden}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.tag{font-size:11px;white-space:nowrap;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--panel2)}
.tag.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.tag.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
#buildTag{font-family:"Cascadia Code",Consolas,monospace;font-size:10.5px;letter-spacing:.4px;cursor:pointer}

/* ---------- 左侧模块栏 ---------- */
#rail{
  position:fixed;left:0;top:var(--header);bottom:0;width:var(--rail-w);z-index:40;
  display:flex;flex-direction:column;gap:2px;padding:18px 12px 16px;
  background:var(--rail);color:var(--rail-txt);overflow-y:auto;
  border-right:1px solid #ffffff0d;
}
.rail-caption{font:10px "Cascadia Code",Consolas,monospace;letter-spacing:1.5px;color:var(--rail-dim);padding:0 12px 8px}
.rail-group{font-size:10px;letter-spacing:.6px;color:var(--rail-dim);padding:16px 12px 6px}
#rail button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:0;background:transparent;color:var(--rail-txt);border-radius:8px;
  padding:9px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
#rail button .ico{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;opacity:.85}
#rail button .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#rail button:hover{background:#ffffff0f;color:#fff}
#rail button[aria-current="true"]{background:var(--rail-on);color:#fff;font-weight:600}
#rail button[aria-current="true"] .ico{opacity:1}
.rail-foot{margin-top:auto;padding:18px 12px 0;font:10px/1.9 "Cascadia Code",Consolas,monospace;color:var(--rail-dim)}

/* ---------- 主内容 ---------- */
main{margin-left:var(--rail-w);padding:0 26px 88px;max-width:1500px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:26px 0 18px;flex-wrap:wrap}
.page-head h2{margin:6px 0 6px;font-size:25px;line-height:1.28;letter-spacing:-.4px;font-weight:650}
.page-head p{margin:0;color:var(--dim);font-size:12.5px;max-width:72ch}
.eyebrow{color:var(--acc);font:600 10px/1.4 "Cascadia Code",Consolas,monospace;letter-spacing:1.8px;text-transform:uppercase}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* 面板 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.card.pad-lg{padding:22px}
.card.accent{border-top:3px solid var(--acc)}
.card h3{margin:0 0 14px;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{margin-left:auto;font-size:11px;font-weight:400;color:var(--dim)}
.card h4{margin:18px 0 8px;font-size:13px;font-weight:650}
.card h4:first-child{margin-top:0}
.grid{display:grid;gap:16px}
.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid.side{grid-template-columns:340px minmax(0,1fr);align-items:start}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--dim)}
.small{font-size:11.5px;line-height:1.85}
.lead{font-size:13.5px;line-height:1.95;color:var(--dim);max-width:78ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hero-actions .btn{padding:11px 20px;font-size:13px}
.pill.block{border-radius:8px;padding:5px 10px;line-height:1.6;align-items:flex-start}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:16px 0}

/* 按钮 */
button.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--txt);
  border-radius:8px;padding:8px 13px;cursor:pointer;font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:background .14s,border-color .14s,color .14s;
}
button.btn:hover{border-color:var(--acc);color:var(--acc);background:var(--panel2)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:650}
button.btn.primary:hover{background:var(--acc-ink);border-color:var(--acc-ink);color:#fff}
button.btn.ghost{background:transparent}
button.btn.mini{padding:5px 9px;font-size:11.5px}
button.btn.danger{color:var(--bad)}
.icon-btn{width:36px;height:36px;padding:0;justify-content:center}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 分段控件 */
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--dim);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--acc);font-weight:650;box-shadow:0 1px 3px #0000000f}

/* 表单 */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label{font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.field label b{color:var(--txt);font-weight:600}
input[type=number],input[type=text],select,textarea{
  width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;font-size:12.5px;color:var(--txt);min-height:36px;
}
input[type=number]{font-family:"Cascadia Code",Consolas,monospace}
select{cursor:pointer}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:var(--panel)}
input[type=range]{width:100%;accent-color:var(--acc);height:20px}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
.row-inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.kpi .v{font:700 24px/1.25 Bahnschrift,"Cascadia Code",Consolas,monospace;letter-spacing:-.5px;margin-top:6px;display:flex;align-items:baseline;gap:4px}
.kpi .v small{font:500 11.5px/1 "Segoe UI",sans-serif;color:var(--dim);letter-spacing:0}
.kpi .d{font-size:11px;margin-top:5px;color:var(--dim)}
.kpi.hl{border-top:3px solid var(--acc)}
.kpi.hl .v{color:var(--acc)}

/* 表格 */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
thead th{
  position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;
  color:var(--dim);padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2;
}
tbody td{padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:nth-child(even){background:var(--row-even)}
tbody tr:hover{background:var(--row-hover)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:"Cascadia Code",Consolas,monospace}
table.plain{min-width:0}
table select{min-width:78px;padding:6px 8px;min-height:32px;font-size:12px}
table td.num{white-space:nowrap}
table input{min-height:32px;padding:6px 8px;font-size:12px}
table.plain td{padding:6px 10px}
table.plain tbody tr:nth-child(even){background:transparent}
tfoot td{padding:9px 11px;font-weight:650;border-top:2px solid var(--line)}

/* 图 */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart.donut{width:auto;max-width:100%}
.chart text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--dim)}
.chart .axis{stroke:var(--line)}
.chart .gridline{stroke:var(--line-soft)}
.chart .val{font-family:"Cascadia Code",Consolas,monospace}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11.5px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 徽标 / 状态 */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--dim);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.pill.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}

/* 折叠面板 */
details.acc{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px;overflow:hidden}
details.acc>summary{cursor:pointer;padding:12px 15px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";margin-left:auto;color:var(--dim);font:16px/1 "Cascadia Code",Consolas,monospace}
details.acc[open]>summary{border-bottom:1px solid var(--line-soft);background:var(--panel2)}
details.acc[open]>summary::after{content:"–"}
details.acc .acc-body{padding:15px}
details.acc>summary .tag{margin-left:6px}

/* 建议条目 */
.sugg{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:start;padding:11px 13px;border:1px solid var(--line);border-radius:9px;margin-bottom:9px;background:var(--panel)}
.sugg .n{width:24px;height:24px;border-radius:7px;background:var(--panel2);display:grid;place-items:center;font:600 11px "Cascadia Code",Consolas,monospace;color:var(--acc)}
.sugg .t{font-size:12.5px;font-weight:600;margin-bottom:3px}
.sugg .m{font-size:11.5px;color:var(--dim);line-height:1.8}
.sugg .v{text-align:right;font:650 13px "Cascadia Code",Consolas,monospace;color:var(--acc);white-space:nowrap}
.sugg .v small{display:block;font-size:10.5px;color:var(--dim);font-weight:400;margin-top:3px}

/* 进度 */
.bar{height:8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}

/* 卡片网格：模块入口 */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--acc);transform:translateY(-1px)}
.tile .k{width:32px;height:32px;border-radius:9px;background:var(--chip);display:grid;place-items:center;margin-bottom:10px;color:var(--acc)}
.tile .k svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile h4{margin:0 0 5px;font-size:13.5px}
.tile p{margin:0;font-size:11.5px;color:var(--dim);line-height:1.8}

/* 时间轴 */
.timeline{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 15px 14px;font-size:12.5px}
.timeline li::before{content:"";position:absolute;left:-25px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--panel)}
.timeline b{font-family:"Cascadia Code",Consolas,monospace;font-size:11.5px;color:var(--acc);display:block;margin-bottom:2px}

/* SWOT */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swot section{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--panel2)}
.swot h5{margin:0 0 8px;font-size:12.5px;display:flex;align-items:center;gap:7px}
.swot h5 i{width:8px;height:8px;border-radius:2px;background:var(--c1)}
.swot[data-k="w"] h5 i{background:var(--c3)}
.swot[data-k="o"] h5 i{background:var(--c2)}
.swot[data-k="t"] h5 i{background:var(--c4)}
.swot ul{margin:0;padding-left:16px;font-size:11.5px;line-height:1.9;color:var(--dim)}

/* 团队 */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--panel)}
.person .nm{font-size:13px;font-weight:650;display:flex;align-items:center;gap:7px}
.person .role{font-size:11px;color:var(--acc);margin:3px 0 7px;font-family:"Cascadia Code",Consolas,monospace}
.person p{margin:0;font-size:11px;color:var(--dim);line-height:1.8}

/* 提示条 */
.note{border:1px solid var(--line);border-left:3px solid var(--acc2);background:var(--panel2);border-radius:8px;padding:10px 13px;font-size:11.5px;color:var(--dim);line-height:1.85}
.note b{color:var(--txt)}
.note.warn{border-left-color:var(--warn)}

/* 状态栏 */
footer.status{
  position:fixed;left:var(--rail-w);right:0;bottom:0;height:34px;z-index:45;
  display:flex;align-items:center;gap:14px;padding:0 16px;font:10.5px/1 "Cascadia Code",Consolas,monospace;
  color:var(--dim);background:var(--panel);border-top:1px solid var(--line);
}
footer.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 7px}
footer.status .sp{margin-left:auto}

/* 打印 */
@media print{
  #rail,footer.status,.app-header,.page-actions,.no-print{display:none!important}
  main{margin:0;padding:0;max-width:none}
  body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid;border-color:#bbb}
  .grid.side{grid-template-columns:1fr}
  details.acc{border-color:#bbb}
  details.acc .acc-body{display:block!important}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:9px;color:#555}
}

/* 响应式 */
@media (max-width:1180px){
  .grid.side{grid-template-columns:minmax(0,1fr)!important}
  .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  :root{--rail-w:0px;--header:64px}
  #rail{
    top:auto;bottom:0;left:0;right:0;width:auto;height:56px;flex-direction:row;gap:0;
    padding:0 6px;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid #ffffff1a;
  }
  #rail .rail-caption,#rail .rail-group,#rail .rail-foot{display:none}
  #rail button{flex:0 0 auto;flex-direction:column;gap:3px;font-size:10px;padding:6px 10px;border-radius:9px}
  #rail button .ico{width:18px;height:18px}
  main{padding:0 14px 96px}
  footer.status{left:0;bottom:56px;height:26px;font-size:10px}
  .grid.two,.grid.three,.swot,.tiles{grid-template-columns:minmax(0,1fr)}
  .card,.grid,.grid>*{min-width:0}
  .page-head{padding:18px 0 14px}
  .page-head h2{font-size:21px}
  .header-steps{display:none}
  .brand-text small{display:none}
  .brand-text h1 span{display:none}
  .app-header{gap:10px;padding:0 14px}
  .sugg{grid-template-columns:24px minmax(0,1fr);gap:8px}
  .sugg .v{grid-column:2;text-align:left;margin-top:2px}
  .sugg .v small{display:inline;margin-left:6px}
  .table-wrap{-webkit-overflow-scrolling:touch}
  .table-wrap::after{content:'';}

<script>
/* 计算内核：个人碳足迹、企业碳账本、绿色积分与兑换。
   纯函数，无 DOM 依赖 —— 浏览器与 node --test 共用同一份代码。 */
(function (global) {
  'use strict';

  var F = (typeof module !== 'undefined' && module.exports)
    ? require('./factors.js')
    : (global.CS && global.CS.factors);

  if (!F) throw new Error('碳寻：排放因子库未加载（core/factors.js 必须先于 core/calc.js）');

  var MAP = F.map;

  /* ---------------- 个人碳足迹 ---------------- */

  var PERSONAL_DEFAULT = {
    food: { beef: 2, pork: 3, poultry: 2, fish: 1.5, egg: 2, dairy: 9, rice: 9, wheat: 3, veg: 12, fruit: 9, meal: 4 },
    home: { elec: 150, gas: 15, water: 6, heat: 0 },
    travel: { car: 400, bus: 60, metro: 80, rail: 0, flight: 0, bike: 40 },
    goods: { tshirt: 1, pants: 1, coat: 0.4, paper: 150, bottle: 20, bag: 20 }
  };

  var FOOD_KEYS = ['beef', 'pork', 'poultry', 'fish', 'egg', 'dairy', 'rice', 'wheat', 'veg', 'fruit', 'meal'];
  var HOME_KEYS = ['elec', 'gas', 'water', 'heat'];
  var TRAVEL_KEYS = ['car', 'bus', 'metro', 'rail', 'flight'];
  var GOODS_KEYS = ['tshirt', 'pants', 'coat', 'paper', 'bottle', 'bag'];

  function num(v, d) {
    var n = typeof v === 'number' ? v : parseFloat(v);
    if (!isFinite(n) || n < 0) return 0;
    return n;
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* 每月排放（kgCO₂e）。衣物按「件/年」录入后摊到月。 */
  function personalEmission(input) {
    var s = input || PERSONAL_DEFAULT;
    var detail = { food: [], home: [], travel: [], goods: [] };
    var g = { food: 0, home: 0, travel: 0, goods: 0 };

    FOOD_KEYS.forEach(function (k) {
      var kg = num(s.food && s.food[k]) * MAP[k].v;
      detail.food.push({ k: k, name: MAP[k].name, unit: MAP[k].unit, qty: num(s.food && s.food[k]), kg: kg });
      g.food += kg;
    });
    HOME_KEYS.forEach(function (k) {
      var kg = num(s.home && s.home[k]) * MAP[k].v;
      detail.home.push({ k: k, name: MAP[k].name, unit: MAP[k].unit, qty: num(s.home && s.home[k]), kg: kg });
      g.home += kg;
    });
    TRAVEL_KEYS.forEach(function (k) {
      var kg = num(s.travel && s.travel[k]) * MAP[k].v;
      detail.travel.push({ k: k, name: MAP[k].name, unit: MAP[k].unit, qty: num(s.travel && s.travel[k]), kg: kg });
      g.travel += kg;
    });
    GOODS_KEYS.forEach(function (k) {
      var q = num(s.goods && s.goods[k]);
      var monthly = (k === 'tshirt' || k === 'pants' || k === 'coat') ? q / 12 : q;
      var kg = monthly * MAP[k].v;
      detail.goods.push({ k: k, name: MAP[k].name, unit: MAP[k].unit, qty: q, kg: kg });
      g.goods += kg;
    });

    /* 骑行 / 步行按替代小汽车计减排（不产生负排放，单列抵扣） */
    var bikeKm = num(s.travel && s.travel.bike);
    var activeSaving = bikeKm * MAP.car.v;

    var gross = g.food + g.home + g.travel + g.goods;
    var net = Math.max(0, gross - activeSaving);

    var items = [];
    ['food', 'home', 'travel', 'goods'].forEach(function (grp) {
      detail[grp].forEach(function (it) { if (it.kg > 0) items.push(it); });
    });
    items.sort(function (a, b) { return b.kg - a.kg; });

    var share = function (v) { return gross > 0 ? v / gross : 0; };

    return {
      detail: detail,
      groups: g,
      grossMonthly: gross,
      activeSaving: activeSaving,
      monthly: net,
      annual: net * 12,
      grossAnnual: gross * 12,
      savedAnnual: activeSaving * 12,
      shares: { food: share(g.food), home: share(g.home), travel: share(g.travel), goods: share(g.goods) },
      topItems: items.slice(0, 5)
    };
  }

  function personalBenchmark(annualKg) {
    var b = F.BENCHMARK.personalAnnual;
    return {
      benchmark: b,
      ratio: b > 0 ? annualKg / b : 0,
      delta: annualKg - b
    };
  }

  /* 减排建议：每条都用当前输入算潜在年减排量，不写死结论。 */
  function suggestions(input, emission) {
    var s = input || PERSONAL_DEFAULT;
    var e = emission || personalEmission(s);
    var out = [];

    var carKm = num(s.travel.car), metroKm = num(s.travel.metro), busKm = num(s.travel.bus);
    if (carKm > 0) {
      var shift = carKm * 0.3;
      var saveCar = shift * (MAP.car.v - MAP.metro.v) * 12;
      out.push({
        id: 'car-to-metro',
        title: '把三成驾车里程换乘轨道 / 公交',
        detail: '每月 ' + Math.round(shift) + ' km 改乘轨道交通，按 0.17 与 0.041 kgCO₂/km 的差值计算。',
        save: saveCar, level: '中'
      });
    }

    var meat = num(s.food.beef) + num(s.food.pork) + num(s.food.poultry);
    if (meat > 0) {
      var meatKg = (num(s.food.beef) * 60 + num(s.food.pork) * 7.2 + num(s.food.poultry) * 6.1);
      out.push({
        id: 'less-beef',
        title: '每周两天素食，牛肉减半',
        detail: '肉类结构里牛肉占比最高时收益最大；按现有肉类排放的 35% 折算可减量。',
        save: meatKg * 0.35 * 12, level: '易'
      });
    }

    var elec = num(s.home.elec);
    if (elec > 0) {
      out.push({
        id: 'elec-26',
        title: '空调 26 ℃、待机断电',
        detail: '按家庭月度用电 8% 的降幅估算，乘 0.5703 kgCO₂/kWh 的电网因子。',
        save: elec * 0.08 * MAP.elec.v * 12, level: '易'
      });
    }

    var paper = num(s.goods.paper);
    if (paper > 0) {
      out.push({
        id: 'paper-double',
        title: 'A4 双面打印、无纸化归档',
        detail: '纸张用量减半，单张 5 gCO₂e。',
        save: paper * 0.5 * MAP.paper.v * 12, level: '易'
      });
    }

    var bottle = num(s.goods.bottle);
    if (bottle > 0) {
      out.push({
        id: 'cup',
        title: '自带水杯与餐具',
        detail: '一次性 PET 瓶减少 80%，单瓶 0.082 kgCO₂e。',
        save: bottle * 0.8 * MAP.bottle.v * 12, level: '易'
      });
    }

    var clothKg = (num(s.goods.tshirt) * MAP.tshirt.v + num(s.goods.pants) * MAP.pants.v + num(s.goods.coat) * MAP.coat.v);
    if (clothKg > 0) {
      out.push({
        id: 'cloth-life',
        title: '衣物延寿一年、优先二手',
        detail: '新购量减少 40%，按现有服装隐含碳折算。',
        save: clothKg * 0.4, level: '中'
      });
    }

    var bikeKm = num(s.travel.bike);
    var bikeTarget = Math.max(120, bikeKm * 2);
    out.push({
      id: 'active-travel',
      title: '5 km 内通勤改骑行 / 步行',
      detail: '把每月骑行里程提到 ' + Math.round(bikeTarget) + ' km，替代小汽车出行。',
      save: Math.max(0, (bikeTarget - bikeKm)) * MAP.car.v * 12, level: '中'
    });

    if (e.groups.food > 0) {
      out.push({
        id: 'food-waste',
        title: '按需备餐，减少 10% 食物浪费',
        detail: '食物从生产到餐桌的隐含碳按现有食物排放的 10% 折算。',
        save: e.groups.food * 0.1 * 12, level: '中'
      });
    }

    out = out.filter(function (x) { return x.save > 0; });
    out.sort(function (a, b) { return b.save - a.save; });
    out.forEach(function (x, i) { x.rank = i + 1; x.points = pointsFromCarbonKg(x.save); });
    return out;
  }

  function suggestionsTotal(list) {
    return list.reduce(function (s, x) { return s + x.save; }, 0);
  }

  /* ---------------- 企业碳账本 ---------------- */

  var ENTERPRISE_DEFAULT = {
    name: '示例企业（机械制造）',
    output: 5000,      // 万元产值
    employees: 300,
    sector: 'machinery',
    rows: [
      { id: 'r1', scope: 1, fk: 'gas', qty: 12000, note: '锅炉与食堂天然气' },
      { id: 'r2', scope: 1, fk: 'gasoline', qty: 2000, note: '公务车汽油' },
      { id: 'r3', scope: 1, fk: 'diesel', qty: 1500, note: '厂内叉车与货车' },
      { id: 'r4', scope: 2, fk: 'elec', qty: 1200000, note: '外购电力（生产+办公）' },
      { id: 'r5', scope: 3, fk: 'commute', qty: 1500000, note: '员工通勤 300 人 × 20 km × 250 工作日' },
      { id: 'r6', scope: 3, fk: 'freight', qty: 200000, note: '上游原材料公路运输' },
      { id: 'r7', scope: 3, fk: 'flight', qty: 60000, note: '差旅航空' },
      { id: 'r8', scope: 3, fk: 'paper', qty: 20000, note: '办公用纸' }
    ]
  };

  function enterpriseRows(rows) {
    var list = (rows || []).map(function (r) {
      var f = MAP[r.fk] || { v: 0, name: r.fk || '自定义', unit: '-' };
      var kg = num(r.qty) * f.v;
      return {
        id: r.id, scope: r.scope, fk: r.fk, qty: num(r.qty), note: r.note || '',
        name: f.name, unit: f.unit, factor: f.v, kg: kg, t: kg / 1000
      };
    });
    return list;
  }

  function enterpriseSummary(model) {
    var m = model || ENTERPRISE_DEFAULT;
    var list = enterpriseRows(m.rows);
    var total = 0, byScope = { 1: 0, 2: 0, 3: 0 };
    list.forEach(function (r) {
      total += r.t;
      byScope[r.scope] = (byScope[r.scope] || 0) + r.t;
    });

    var output = num(m.output);
    var intensity = output > 0 ? total / output : 0;

    var sector = null;
    for (var i = 0; i < F.SECTORS.length; i++) if (F.SECTORS[i].k === m.sector) sector = F.SECTORS[i];
    var bench = sector ? sector.v : 0;
    var freeQuota = output * bench;
    var gap = total - freeQuota;

    var sorted = list.slice().sort(function (a, b) { return b.t - a.t; });
    var acc = 0;
    var pareto = sorted.map(function (r) {
      acc += r.t;
      return { name: r.name, note: r.note, t: r.t, share: total > 0 ? r.t / total : 0, cum: total > 0 ? acc / total : 0 };
    });

    var perCapita = num(m.employees) > 0 ? total * 1000 / num(m.employees) : 0;

    return {
      rows: list, total: total, byScope: byScope,
      output: output, intensity: intensity,
      sector: sector, benchmark: bench, freeQuota: freeQuota, gap: gap,
      ratio: bench > 0 ? intensity / bench : 0,
      pareto: pareto, perCapita: perCapita,
      emissionLevel: intensity === 0 ? 'none' : (intensity <= bench * 0.85 ? 'low' : (intensity <= bench * 1.1 ? 'mid' : 'high'))

  }

  /* ---------------- 积分 / 兑换 ---------------- */

  function pointsFromCarbonKg(kg) {
    return Math.max(0, Math.round(num(kg) * F.POINTS.perKg));
  }

  function redeemPlan(points, items) {
    var left = Math.max(0, Math.round(num(points)));
    var list = (items || F.POINTS.items).map(function (it) {
      var count = it.cost > 0 ? Math.floor(left / it.cost) : 0;
      left -= count * it.cost;
      return {
        k: it.k, name: it.name, cost: it.cost, kind: it.kind,
        count: count, spent: count * it.cost,
        credit: it.kind === 'carbon' ? count * (it.credit || 0) : 0,
        note: it.note
      };
    });
    var spent = list.reduce(function (s, x) { return s + x.spent; }, 0);
    var credit = list.reduce(function (s, x) { return s + x.credit; }, 0);
    var ocean = list.filter(function (x) { return x.k === 'ocean'; })
      .reduce(function (s, x) { return s + x.count; }, 0);
    return { list: list, spent: spent, left: left, credit: credit, oceanKg: ocean };
  }

  /* ---------------- 图表数据 ---------------- */

  var SEASON = [0.92, 0.88, 0.9, 0.94, 0.98, 1.08, 1.14, 1.13, 1.02, 0.97, 1.0, 1.04];

  function monthlyTrend(monthlyKg) {
    var m = num(monthlyKg);
    return SEASON.map(function (w, i) {
      return { month: (i + 1) + '月', value: m * w, index: i };
    });
  }

  /* ---------------- 格式化 ---------------- */

  function fmt(n, d) {
    var v = typeof n === 'number' ? n : parseFloat(n);
    if (!isFinite(v)) v = 0;
    var digits = typeof d === 'number' ? d : 1;
    return v.toLocaleString('zh-CN', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  function fmtKg(kg) {
    var v = typeof kg === 'number' ? kg : parseFloat(kg);
    if (!isFinite(v)) v = 0;
    if (v >= 1000) return fmt(v / 1000, 2) + ' t';
    return fmt(v, v < 10 ? 2 : 0) + ' kg';
  }
  function fmtPct(x, d) { return fmt(num(x) * 100, typeof d === 'number' ? d : 1) + '%'; }

  var API = {
    PERSONAL_DEFAULT: PERSONAL_DEFAULT,
    ENTERPRISE_DEFAULT: ENTERPRISE_DEFAULT,
    FOOD_KEYS: FOOD_KEYS, HOME_KEYS: HOME_KEYS, TRAVEL_KEYS: TRAVEL_KEYS, GOODS_KEYS: GOODS_KEYS,
    personalEmission: personalEmission,
    personalBenchmark: personalBenchmark,
    suggestions: suggestions,
    suggestionsTotal: suggestionsTotal,
    enterpriseRows: enterpriseRows,
    enterpriseSummary: enterpriseSummary,
    pointsFromCarbonKg: pointsFromCarbonKg,
    redeemPlan: redeemPlan,
    monthlyTrend: monthlyTrend,
    fmt: fmt, fmtKg: fmtKg, fmtPct: fmtPct,
    clone: clone, num: num
  };

  global.CS = global.CS || {};
  global.CS.calc = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* 轻量 SVG 图表：环形、柱状、横条（可带对标标记）、趋势。
   全部返回字符串，无第三方依赖，颜色取自 CSS 变量（dark 主题由变量自动跟随）。 */
(function (global) {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function niceMax(v) {
    var n = Number(v);
    if (!isFinite(n) || n <= 0) return 1;
    var exp = Math.floor(Math.log(n) / Math.LN10);
    var base = Math.pow(10, exp);
    var f = n / base;
    var steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) {
      if (f <= steps[i] + 1e-9) return steps[i] * base;
    }
    return 10 * base;
  }

  function fnum(v, d) {
    var n = Number(v);
    if (!isFinite(n)) n = 0;
    var digits = typeof d === 'number' ? d : 1;
    return n.toLocaleString('zh-CN', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }

  var PALETTE = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];
  function color(i) { return PALETTE[i % PALETTE.length]; }

  /* ---------- 环形图 ---------- */
  function donut(items, opts) {
    var o = opts || {};
    var size = o.size || 196;
    var thick = o.thickness || 24;
    var r = (size - thick) / 2;
    var cx = size / 2, cy = size / 2;
    var C = 2 * Math.PI * r;
    var total = (items || []).reduce(function (s, it) { return s + Math.max(0, Number(it.value) || 0); }, 0);

    var svg = ['<svg class="chart donut" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="' + esc(o.aria || '构成占比环形图') + '" width="' + size + '" height="' + size + '">'];
    svg.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--line-soft)" stroke-width="' + thick + '"/>');

    if (total > 0) {
      var acc = 0;
      (items || []).forEach(function (it, i) {
        var v = Math.max(0, Number(it.value) || 0);
        if (v <= 0) return;
        var len = (v / total) * C;
        var dash = Math.max(0, len - 2);
        svg.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + (it.color || color(i)) +
          '" stroke-width="' + thick + '" stroke-dasharray="' + dash.toFixed(2) + ' ' + (C - dash).toFixed(2) +
          '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')" stroke-linecap="butt">' +
          '<title>' + esc(it.label + '：' + fnum(v, 2) + '（' + ((v / total) * 100).toFixed(1) + '%）') + '</title></circle>');
        acc += len;
      });
    }

    if (o.centerLabel || o.centerValue) {
      svg.push('<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="20" font-weight="700" fill="var(--txt)" class="val">' + esc(o.centerValue || '') + '</text>');
      svg.push('<text x="' + cx + '" y="' + (cy + 18) + '" text-anchor="middle" font-size="10.5" fill="var(--dim)">' + esc(o.centerLabel || '') + '</text>');
    }
    svg.push('</svg>');
    return svg.join('');
  }

  /* ---------- 竖向柱状图 ---------- */
  function bars(items, opts) {
    var o = opts || {};
    var W = 640, H = o.height || 230;
    var padL = 44, padR = 12, padT = 16, padB = 30;
    var iw = W - padL - padR, ih = H - padT - padB;
    var list = items || [];
    var max = niceMax(Math.max.apply(null, list.map(function (d) { return Number(d.value) || 0; }).concat([0])) || 1);
    var n = Math.max(1, list.length);
    var step = iw / n;
    var bw = Math.min(46, step * 0.58);

    var svg = ['<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.aria || '柱状图') + '" preserveAspectRatio="xMidYMid meet">'];
    for (var t = 0; t <= 4; t++) {
      var y = padT + ih - (ih * t) / 4;
      svg.push('<line class="gridline" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke-dasharray="' + (t === 0 ? '0' : '3 4') + '"/>');
      svg.push('<text x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" class="val">' + esc(fnum((max * t) / 4, max < 10 ? 1 : 0)) + '</text>');
    }

    list.forEach(function (d, i) {
      var v = Math.max(0, Number(d.value) || 0);
      var h = max > 0 ? (v / max) * ih : 0;
      var x = padL + step * i + (step - bw) / 2;
      var yTop = padT + ih - h;
      svg.push('<rect x="' + x.toFixed(1) + '" y="' + yTop.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) +
        '" rx="4" fill="' + (d.color || 'var(--c1)') + '"><title>' + esc(d.label + '：' + fnum(v, 2)) + '</title></rect>');
      if (o.showValue !== false) {
        svg.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (yTop - 5).toFixed(1) + '" text-anchor="middle" font-size="9.5" class="val" fill="var(--dim)">' + esc(fnum(v, v < 10 ? 1 : 0)) + '</text>');
      }
      svg.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="9.5">' + esc(d.label) + '</text>');
    });

    svg.push('</svg>');
    return svg.join('');
  }

  /* ---------- 横向条（带可选对标标记）---------- */
  function hbars(items, opts) {
    var o = opts || {};
    var W = 640;
    var list = items || [];
    var rowH = o.rowH || 30;
    var H = Math.max(70, list.length * rowH + 26);
    var padL = o.labelWidth || 132, padR = o.valueWidth || 96, padT = 8;
    var iw = W - padL - padR;
    var max = niceMax(Math.max.apply(null, list.map(function (d) {
      return Math.max(Number(d.value) || 0, Number(d.marker) || 0);
    }).concat([0])) || 1);

    var svg = ['<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.aria || '横向条形图') + '" preserveAspectRatio="xMidYMid meet">'];
    list.forEach(function (d, i) {
      var y = padT + i * rowH;
      var v = Math.max(0, Number(d.value) || 0);
      var w = max > 0 ? (v / max) * iw : 0;
      svg.push('<text x="0" y="' + (y + rowH / 2 + 3.5) + '" font-size="10.5">' + esc(d.label) + '</text>');
      svg.push('<rect x="' + padL + '" y="' + (y + 7) + '" width="' + iw + '" height="10" rx="5" fill="var(--line-soft)"/>');
      svg.push('<rect x="' + padL + '" y="' + (y + 7) + '" width="' + Math.max(1, w).toFixed(1) + '" height="10" rx="5" fill="' + (d.color || 'var(--c1)') + '"><title>' + esc(d.label + '：' + fnum(v, 2)) + '</title></rect>');
      if (d.marker != null && isFinite(Number(d.marker))) {
        var mx = padL + (Number(d.marker) / max) * iw;
        svg.push('<line x1="' + mx.toFixed(1) + '" x2="' + mx.toFixed(1) + '" y1="' + (y + 2) + '" y2="' + (y + 22) + '" stroke="var(--c3)" stroke-width="1.6" stroke-dasharray="3 2"/>');
      }
      svg.push('<text x="' + (padL + iw + 6) + '" y="' + (y + rowH / 2 + 3.5) + '" font-size="10" class="val">' + esc(fnum(v, 2) + (o.unit || '')) + '</text>');
    });
    svg.push('</svg>');
    return svg.join('');
  }

  /* ---------- 趋势面积图 ---------- */
  function trend(items, opts) {
    var o = opts || {};
    var W = 640, H = o.height || 200;
    var padL = 44, padR = 14, padT = 14, padB = 26;
    var iw = W - padL - padR, ih = H - padT - padB;
    var list = items || [];
    var max = niceMax(Math.max.apply(null, list.map(function (d) { return Number(d.value) || 0; }).concat([1])));
    var n = Math.max(1, list.length - 1);

    function px(i) { return padL + (iw * i) / n; }
    function py(v) { return padT + ih - (Math.max(0, Number(v) || 0) / max) * ih; }

    var svg = ['<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.aria || '趋势图') + '" preserveAspectRatio="xMidYMid meet">'];
    for (var t = 0; t <= 4; t++) {
      var y = padT + ih - (ih * t) / 4;
      svg.push('<line class="gridline" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke-dasharray="' + (t === 0 ? '0' : '3 4') + '"/>');
      svg.push('<text x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" class="val">' + esc(fnum((max * t) / 4, 0)) + '</text>');
    }

    var pts = list.map(function (d, i) { return px(i).toFixed(1) + ',' + py(d.value).toFixed(1); });
    if (pts.length) {
      var area = 'M' + px(0).toFixed(1) + ',' + (padT + ih) + ' L' + pts.join(' L') + ' L' + px(list.length - 1).toFixed(1) + ',' + (padT + ih) + ' Z';
      svg.push('<path d="' + area + '" fill="var(--c1)" fill-opacity="0.13" stroke="none"/>');
      svg.push('<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
      list.forEach(function (d, i) {
        if (list.length <= 13) {
          svg.push('<circle cx="' + px(i).toFixed(1) + '" cy="' + py(d.value).toFixed(1) + '" r="2.6" fill="var(--panel)" stroke="var(--c1)" stroke-width="1.6"><title>' + esc(d.month + '：' + fnum(d.value, 1) + (o.unit || ' kg')) + '</title></circle>');
        }
        svg.push('<text x="' + px(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9">' + esc(d.month) + '</text>');
      });
    }
    svg.push('</svg>');
    return svg.join('');
  }

  function legend(items) {
    return '<div class="legend">' + (items || []).map(function (it, i) {
      return '<span><i style="background:' + (it.color || color(i)) + '"></i>' + esc(it.label) + '</span>';
    }).join('') + '</div>';
  }

  var API = { donut: donut, bars: bars, hbars: hbars, trend: trend, legend: legend, esc: esc, niceMax: niceMax, color: color, fnum: fnum };
  global.CS = global.CS || {};
  global.CS.charts = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

<script>
/* 状态持久化与导出工具。localStorage 不可用时自动退化为内存态。 */
(function (global) {
  'use strict';

  var KEY = 'carbon-seeker:state:v1';
  var memory = null;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function defaults(calc) {
    return {
      view: 'overview',
      theme: 'light',
      personal: clone(calc.PERSONAL_DEFAULT),
      enterprise: clone(calc.ENTERPRISE_DEFAULT),
      points: null
    };
  }

  function merge(base, patch) {
    if (!patch || typeof patch !== 'object') return base;
    Object.keys(patch).forEach(function (k) {
      var v = patch[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        merge(base[k], v);
      } else {
        base[k] = v;
      }
    });
    return base;
  }

  function load(calc) {
    var base = defaults(calc);
    var raw = null;
    try { raw = global.localStorage ? global.localStorage.getItem(KEY) : memory; } catch (err) { raw = memory; }
    if (!raw) return base;
    try {
      var parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
      return merge(base, parsed);
    } catch (err) {
      return base;
    }
  }

  function save(state) {
    var raw = JSON.stringify({ view: state.view, theme: state.theme, personal: state.personal, enterprise: state.enterprise, points: state.points });
    memory = raw;
    try { if (global.localStorage) global.localStorage.setItem(KEY, raw); } catch (err) { /* 隐私模式下静默 */ }
  }

  function reset(calc) {
    var base = defaults(calc);
    try { if (global.localStorage) global.localStorage.removeItem(KEY); } catch (err) { /* noop */ }
    memory = null;
    return base;
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
  }

  function stamp(d) {
    var t = d || new Date();
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return t.getFullYear() + p(t.getMonth() + 1) + p(t.getDate()) + '-' + p(t.getHours()) + p(t.getMinutes());
  }

  var API = { KEY: KEY, load: load, save: save, reset: reset, download: download, stamp: stamp, clone: clone };
  global.CS = global.CS || {};
  global.CS.store = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

    var potential = K.suggestionsTotal(sug);

    var kpis = '<section class="kpis">' +
      kpi('月排放', K.fmt(em.monthly, 1), 'kgCO₂e', '含绿色出行抵扣 ' + K.fmt(em.activeSaving, 1) + ' kg', 'hl') +
      kpi('年排放', K.fmt(em.annual / 1000, 2), 'tCO₂e', '毛排放 ' + K.fmt(em.grossAnnual / 1000, 2) + ' t') +
      kpi('对比基准', (bench.ratio * 100).toFixed(0) + '%', '基准值', (bench.delta >= 0 ? '高出 ' : '低于 ') + K.fmt(Math.abs(bench.delta) / 1000, 2) + ' t') +
      kpi('可减碳潜力', K.fmt(potential / 1000, 2), 'tCO₂e/年', '落地后约减 ' + K.fmt(Math.min(99, potential / Math.max(1, em.annual) * 100), 0) + '%') +
      '</section>';

    var foodCard = '<div class="card accent"><h3>① 食物 <span class="sub">每月用量</span></h3>' +
      '<div class="row-inline">' + K.FOOD_KEYS.map(function (k) {
        return field('personal.food.' + k, FOOD_LABEL[k] || meta(k).name, s.food[k], 'kg/月',
          { step: 0.5, title: meta(k).name + ' ' + meta(k).v + ' kgCO₂e/' + meta(k).unit });
      }).join('') + '</div></div>';

    var homeCard = '<div class="card"><h3>② 居住 <span class="sub">每月用量</span></h3>' +
      '<div class="row-inline">' + K.HOME_KEYS.map(function (k) {
        return field('personal.home.' + k, HOME_LABEL[k] || meta(k).name, s.home[k], meta(k).unit + '/月',
          { step: k === 'heat' ? 0.1 : 1, title: meta(k).name + ' ' + meta(k).v + ' kgCO₂e/' + meta(k).unit });
      }).join('') + '</div></div>';

    var travelCard = '<div class="card"><h3>③ 出行 <span class="sub">每月里程</span></h3>' +
      '<div class="row-inline">' + K.TRAVEL_KEYS.concat(['bike']).map(function (k) {
        return field('personal.travel.' + k, TRAVEL_LABEL[k] || meta(k).name, s.travel[k], 'km/月',
          { step: 10, title: meta(k).name + ' ' + meta(k).v + ' kgCO₂e/' + meta(k).unit });
      }).join('') + '</div>' +
      '<div class="note" style="margin-top:4px">骑行 / 步行按替代小汽车 0.17 kgCO₂/km 计入抵扣，不产生负排放。</div></div>';

    var goodsCard = '<div class="card"><h3>④ 用品 <span class="sub">衣物按年、耗材按月</span></h3>' +
      '<div class="row-inline">' + K.GOODS_KEYS.map(function (k) {
        return field('personal.goods.' + k, GOODS_LABEL[k] || meta(k).name, s.goods[k], GOODS_UNIT[k] || (meta(k).unit + '/月'),
          { step: k === 'coat' ? 0.1 : 1, title: meta(k).name + ' ' + meta(k).v + ' kgCO₂e/' + meta(k).unit });
      }).join('') + '</div>' +
      '<div class="page-actions" style="margin-top:6px">' +
      '<button class="btn mini" data-act="personal-reset">恢复示例值</button>' +
      '<button class="btn mini" data-act="personal-zero">全部清零</button>' +
      '</div></div>';

    var groups = [
      { k: 'food', label: '食物', v: em.groups.food, color: 'var(--c1)' },
      { k: 'home', label: '居住', v: em.groups.home, color: 'var(--c2)' },
      { k: 'travel', label: '出行', v: em.groups.travel, color: 'var(--c3)' },
      { k: 'goods', label: '用品', v: em.groups.goods, color: 'var(--c4)' }
    ];

    var donut = C.donut(groups.map(function (g) { return { label: g.label, value: g.v, color: g.color }; }),
      { size: 190, thickness: 24, centerValue: K.fmt(em.monthly, 0), centerLabel: 'kgCO₂e / 月', aria: '个人排放构成' });

    var breakdown = groups.map(function (g) {
      var pct = em.grossMonthly > 0 ? g.v / em.grossMonthly : 0;
      return '<div style="margin-bottom:11px">' +
        '<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px">' +
        '<span>' + esc(g.label) + '</span>' +
        '<span class="mono">' + K.fmt(g.v, 1) + ' kg · ' + (pct * 100).toFixed(0) + '%</span></div>' +
        bar(pct, g.color) + '</div>';
    }).join('');

    var compose = '<div class="card"><h3>排放构成 <span class="sub">每月 kgCO₂e</span></h3>' +
      '<div class="grid two" style="align-items:center;gap:8px">' +
      '<div>' + donut + '</div><div>' + breakdown + '</div></div>' +
      '<div class="note" style="margin-top:6px">毛排放 ' + K.fmt(em.grossMonthly, 1) + ' kg − 绿色出行抵扣 ' +
      K.fmt(em.activeSaving, 1) + ' kg = <b>' + K.fmt(em.monthly, 1) + ' kg/月</b>。</div></div>';

    var trendCard = '<div class="card"><h3>月度趋势 <span class="sub">按季节系数还原的演示曲线</span></h3>' +
      C.trend(K.monthlyTrend(em.monthly), { height: 190, unit: ' kg' }) +
      '<div class="note" style="margin-top:6px">季节系数取 0.88–1.14（夏冬季用电与出行偏高），用于展示波动，' +
      '不代表真实月度计量；真实项目需按电表与出行账单逐月核算。</div></div>';

    var topRows = em.topItems.length ? em.topItems.map(function (it) {
      return '<tr><td>' + esc(NAME_MAP[it.k] || it.name) + '</td><td class="num">' + K.fmt(it.qty, 1) + '</td><td>' + esc(it.unit) + '</td>' +
        '<td class="num">' + K.fmt(it.kg, 1) + '</td><td class="num">' + ((it.kg / Math.max(1, em.grossMonthly)) * 100).toFixed(1) + '%</td></tr>';
    }).join('') : '<tr><td colspan="5" class="muted">还没有排放项，先在上面填几个数。</td></tr>';

    var top = '<div class="card"><h3>排放明细 Top 5 <span class="sub">按贡献排序</span></h3>' +
      table([{ label: '项目' }, { label: '用量', num: true }, { label: '单位' }, { label: 'kgCO₂e/月', num: true }, { label: '占比', num: true }], topRows) +
      '</div>';

    var suggList = sug.slice(0, 6).map(function (x) {
      return '<div class="sugg"><div class="n">' + x.rank + '</div>' +
        '<div><div class="t">' + esc(x.title) + ' <span class="pill">' + esc(x.level) + '</span></div>' +
        '<div class="m">' + esc(x.detail) + '</div></div>' +
        '<div class="v">−' + K.fmt(x.save, 0) + ' kg<small>/年 · ' + K.fmt(x.points, 0) + ' 分</small></div></div>';
    }).join('');

    var suggCard = '<div class="card"><h3>减排建议 <span class="sub">按当前输入实算，不写死结论</span></h3>' +
      (suggList || '<div class="muted small">填入用量后这里会出现按可减量排序的建议。</div>') +
      '<div class="note" style="margin-top:6px">全部建议落地合计约 <b>' + K.fmt(potential, 0) + ' kgCO₂e/年</b>，' +
      '相当于基准值的 ' + ((potential / Math.max(1, bench.benchmark)) * 100).toFixed(0) + '%。</div></div>';

    var pointsCard = '<div class="card"><h3>绿色积分 <span class="sub">1 kg 减排 = 10 分</span></h3>' +
      '<div class="grid two" style="gap:12px">' +
      '<div><div class="kpi hl" style="margin:0"><div class="k">按建议全部落地可获积分</div>' +
      '<div class="v">' + K.fmt(K.pointsFromCarbonKg(potential), 0) + '<small>分</small></div>' +
      '<div class="d">' + K.fmt(potential, 0) + ' kgCO₂e/年 减排量</div></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<button class="btn primary" data-go="points">去兑换</button>' +
      '<button class="btn" data-act="export-json">导出 JSON</button>' +
      '<button class="btn" data-act="export-md">导出 Markdown 报告</button>' +
      '</div></div></div>';

    return pageHead('个人模块 · 碳足迹记录',
      '衣食住行逐项算，一个月多少碳',
      '四类输入全部按自然单位录入（kg、kWh、m³、km、件），右侧结果随输入实时更新；每个因子都能在「数据与方法」里查到出处。',
      '<button class="btn" data-act="export-json">导出 JSON</button>' +
      '<button class="btn primary" data-act="export-md">导出报告</button>') +
      kpis +
      '<div class="grid side">' +
      '<div>' + foodCard + homeCard + travelCard + goodsCard + '</div>' +
      '<div>' + compose + trendCard + top + suggCard + pointsCard + '</div>' +
      '</div>';
  }

  /* ---------------- 企业碳账本 ---------------- */

  function factorOptions(selected) {
    var groups = {};
    F.FACTORS.forEach(function (f) { (groups[f.g] = groups[f.g] || []).push(f); });
    return Object.keys(groups).map(function (g) {
      return '<optgroup label="' + esc(g) + '">' + groups[g].map(function (f) {
        return '<option value="' + esc(f.k) + '"' + (f.k === selected ? ' selected' : '') + '>' +
          esc(f.name) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
  }

  function enterprise(state) {
    var m = state.enterprise;
    var sum = K.enterpriseSummary(m);

    var kpis = '<section class="kpis">' +
      kpi('排放总量', K.fmt(sum.total, 1), 'tCO₂e', m.rows.length + ' 条排放源', 'hl') +
      kpi('排放强度', K.fmt(sum.intensity, 3), 't/万元', '产值 ' + K.fmt(sum.output, 0) + ' 万元') +
      kpi('行业对标', sum.benchmark > 0 ? (sum.ratio * 100).toFixed(0) + '%' : '—', sum.sector ? sum.sector.name : '未选行业',
        sum.benchmark > 0 ? (sum.ratio <= 1 ? '优于基准 ' : '高于基准 ') + K.fmt(Math.abs(sum.intensity - sum.benchmark), 3) : '') +
      kpi(sum.gap > 0 ? '配额缺口' : '配额盈余', K.fmt(Math.abs(sum.gap), 1), 'tCO₂e', '免费配额 ' + K.fmt(sum.freeQuota, 1) + ' t') +
      '</section>';

    var info = '<div class="card accent"><h3>企业基本信息</h3>' +
      '<div class="field"><label for="entName"><span>企业名称</span><b>展示用</b></label>' +
      '<input id="entName" type="text" value="' + esc(m.name) + '" data-bind="enterprise.name"></div>' +
      '<div class="row-inline">' +
      field('enterprise.output', '年产值', m.output, '万元', { step: 100 }) +
      field('enterprise.employees', '员工人数', m.employees, '人', { step: 10 }) +
      '</div>' +
      '<div class="field"><label for="entSector"><span>所属行业</span><b>强度基准</b></label>' +
      '<select id="entSector" data-bind="enterprise.sector">' + F.SECTORS.map(function (s) {
        return '<option value="' + esc(s.k) + '"' + (s.k === m.sector ? ' selected' : '') + '>' +
          esc(s.name + '（' + s.v + ' t/万元）') + '</option>';
      }).join('') + '</select></div>' +
      '<button class="btn mini" data-act="enterprise-reset">恢复示例企业</button>' +
      '</div>';

    var scopeName = { 1: 'Scope 1', 2: 'Scope 2', 3: 'Scope 3' };
    var rows = m.rows.map(function (r) {
      var f = F.map[r.fk] || { v: 0, unit: '-', name: '-' };
      var t = (parseFloat(r.qty) || 0) * f.v / 1000;
      return '<tr>' +
        '<td><select data-row="' + esc(r.id) + '" data-field="scope" aria-label="排放范围">' +
        [1, 2, 3].map(function (n) {
          return '<option value="' + n + '"' + (Number(r.scope) === n ? ' selected' : '') + '>' + scopeName[n] + '</option>';
        }).join('') + '</select></td>' +
        '<td><select data-row="' + esc(r.id) + '" data-field="fk" aria-label="排放源">' + factorOptions(r.fk) + '</select></td>' +
        '<td class="num"><input type="number" min="0" step="1" value="' + esc(r.qty) + '" data-row="' + esc(r.id) + '" data-field="qty" style="width:118px" aria-label="用量"></td>' +
        '<td>' + esc(f.unit) + '</td>' +
        '<td class="num">' + K.fmt(f.v, f.v >= 100 ? 0 : 3) + '</td>' +
        '<td class="num"><b>' + K.fmt(t, 2) + '</b></td>' +
        '<td><input type="text" value="' + esc(r.note || '') + '" data-row="' + esc(r.id) + '" data-field="note" style="min-width:150px" aria-label="备注"></td>' +
        '<td><button class="btn mini danger" data-del="' + esc(r.id) + '" aria-label="删除该行">×</button></td>' +
        '</tr>';
    }).join('');

    var foot = '<tr><td colspan="5">合计</td><td class="num">' + K.fmt(sum.total, 2) + ' t</td><td colspan="2" class="muted">' +
      'S1 ' + K.fmt(sum.byScope[1] || 0, 1) + ' · S2 ' + K.fmt(sum.byScope[2] || 0, 1) + ' · S3 ' + K.fmt(sum.byScope[3] || 0, 1) + '</td></tr>';

    var ledger = '<div class="card"><h3>碳账本 <span class="sub">按 Scope 1 / 2 / 3 填报，单位自适应</span>' +
      '<button class="btn mini" data-act="row-add" style="margin-left:auto">+ 新增排放源</button></h3>' +
      table([
        { label: '范围' }, { label: '排放源' }, { label: '用量', num: true }, { label: '单位' },
        { label: '因子', num: true }, { label: 'tCO₂e', num: true }, { label: '备注' }, { label: '' }
      ], rows, { foot: foot }) +
      '<div class="note" style="margin-top:10px">Scope 1 = 自有燃烧与逸散；Scope 2 = 外购电与热；Scope 3 = 通勤、货运、差旅、办公等价值链排放。' +
      '因子列显示当前换算系数（kgCO₂e / 单位），改排放源会自动换单位。</div></div>';

    var scopeItems = [
      { label: 'Scope 1 直接排放', value: sum.byScope[1] || 0, color: 'var(--c3)' },
      { label: 'Scope 2 外购能源', value: sum.byScope[2] || 0, color: 'var(--c1)' },
      { label: 'Scope 3 价值链', value: sum.byScope[3] || 0, color: 'var(--c2)' }
    ];

    var scopeCard = '<div class="card"><h3>排放范围构成</h3>' +
      C.donut(scopeItems, { size: 190, thickness: 24, centerValue: K.fmt(sum.total, 0), centerLabel: 'tCO₂e / 年', aria: '企业排放范围构成' }) +
      '<div style="margin-top:10px">' + scopeItems.map(function (it) {
        var pct = sum.total > 0 ? it.value / sum.total : 0;
        return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin-bottom:4px">' +
          '<span>' + esc(it.label) + '</span><span class="mono">' + K.fmt(it.value, 1) + ' t · ' + (pct * 100).toFixed(0) + '%</span></div>' +
          bar(pct, it.color) + '</div>';
      }).join('') + '</div>' +
      '<div class="note">人均排放 ' + K.fmt(sum.perCapita / 1000, 2) + ' tCO₂e/人·年（' + K.fmt(m.employees, 0) + ' 人）。</div></div>';

    var benchItems = [{ label: '本企业', value: sum.intensity, color: 'var(--c1)', marker: sum.intensity }].concat(
      F.SECTORS.map(function (s) { return { label: s.name, value: s.v, color: 'var(--c4)', marker: sum.intensity }; })
    );

    var benchCard = '<div class="card"><h3>行业强度对标 <span class="sub">虚线 = 本企业强度</span></h3>' +
      C.hbars(benchItems, { unit: ' t/万元', labelWidth: 128, rowH: 30, aria: '行业碳强度对标' }) +
      '<div class="note" style="margin-top:8px">行业强度为示意值，用于同一口径下的相对比较；正式披露应采用生态环境部发布的行业核算指南与基准值。</div></div>';

    var paretoCard = '<div class="card"><h3>排放源帕累托 <span class="sub">找出前 3 个该先动的口子</span></h3>' +
      (sum.pareto.length ? C.hbars(sum.pareto.map(function (p, i) {
        return { label: p.name, value: p.t, color: i === 0 ? 'var(--c1)' : (i < 3 ? 'var(--c2)' : 'var(--c4)') };
      }), { unit: ' t', labelWidth: 156, rowH: 28 }) : '<div class="muted small">还没有排放源。</div>') +
      (sum.pareto.length ? table([{ label: '排名' }, { label: '排放源' }, { label: 'tCO₂e', num: true }, { label: '占比', num: true }, { label: '累计', num: true }],
        sum.pareto.slice(0, 6).map(function (p, i) {
          return '<tr><td>' + (i + 1) + '</td><td>' + esc(p.name) + (p.note ? ' <span class="muted small">' + esc(p.note) + '</span>' : '') + '</td>' +
            '<td class="num">' + K.fmt(p.t, 2) + '</td><td class="num">' + (p.share * 100).toFixed(1) + '%</td>' +
            '<td class="num">' + (p.cum * 100).toFixed(1) + '%</td></tr>';
        }).join(''), { plain: true }) : '') +
      '</div>';

    return pageHead('企业模块 · 碳账本',
      '一家企业的碳账本长什么样',
      '按排放源逐行填报，自动汇总 Scope 占比、产值强度、行业对标与配额缺口；示例企业为机械制造，可按自己的行业替换。',
      '<button class="btn" data-act="export-csv">导出 CSV</button>' +
      '<button class="btn primary" data-act="export-md">导出报告</button>') +
      kpis +
      '<div class="grid" style="grid-template-columns:340px minmax(0,1fr);align-items:start">' +
      '<div>' + info + scopeCard + '</div>' +
      '<div>' + ledger + '</div>' +
      '</div>' +
      '<div class="grid two" style="align-items:start">' + benchCard + paretoCard + '</div>';
  }

  /* ---------------- 绿色积分 ---------------- */

  function points(state) {
    var em = K.personalEmission(state.personal);
    var sug = K.suggestions(state.personal, em);
    var potential = K.suggestionsTotal(sug);
    var auto = K.pointsFromCarbonKg(potential);
    var balance = state.points == null ? auto : Math.max(0, Math.round(Number(state.points) || 0));
    var plan = K.redeemPlan(balance, F.POINTS.items);

    var kpis = '<section class="kpis">' +
      kpi('可用积分', K.fmt(balance, 0), '分', state.points == null ? '来自个人页的减排潜力' : '手动设定', 'hl') +
      kpi('折算减排量', K.fmt(balance / F.POINTS.perKg, 1), 'kgCO₂e', '1 kg = 10 分') +
      kpi('兑换固碳量', K.fmt(plan.credit, 2), 'kgCO₂e', '螺旋藻 / 旧物 / 林木合计') +
      kpi('生态贡献', K.fmt(plan.oceanKg, 0), 'kg 海洋垃圾', '计生态量，不折碳') +
      '</section>';

    var ruleCard = '<div class="card accent"><h3>积分怎么来、怎么用</h3>' +
      '<ol class="small muted" style="margin:0 0 12px;padding-left:18px;line-height:2.1">' +
      '<li>签到、微信步数同步、观看广告获得基础积分。</li>' +
      '<li>减碳行为按 <b>1 kg 减排 = 10 分</b> 折算，由平台核算后排碳量。</li>' +
      '<li>积分可兑换螺旋藻制品、海洋垃圾清理、旧物循环与合作林场。</li>' +
      '<li>企业侧积分可计入员工绩效考核，助力碳中和企业认证。</li>' +
      '</ol>' +
      '<div class="field"><label for="pts"><span>手动设定积分（留空 = 用个人页测算值 ' + K.fmt(auto, 0) + '）</span><b>分</b></label>' +
      '<input id="pts" type="number" min="0" step="100" value="' + (state.points == null ? '' : esc(state.points)) + '" data-bind="points" placeholder="' + K.fmt(auto, 0) + '"></div>' +
      '<div class="page-actions">' +
      '<button class="btn mini" data-act="points-auto">用测算值</button>' +
      '<button class="btn mini" data-go="personal">去减少排放</button>' +
      '</div></div>';

    var itemsCard = '<div class="card"><h3>可兑换物 <span class="sub">按当前积分计算可换数量</span></h3>' +
      plan.list.map(function (it) {
        var pct = it.cost > 0 ? Math.min(1, balance / it.cost) : 0;
        return '<div class="sugg" style="grid-template-columns:minmax(0,1fr) auto;align-items:center">' +
          '<div><div class="t">' + esc(it.name) + ' <span class="pill ' + (it.count > 0 ? 'ok' : '') + '">' +
          (it.count > 0 ? '可换 ' + it.count + ' 份' : '差 ' + K.fmt(it.cost - balance, 0) + ' 分') + '</span></div>' +
          '<div class="m">' + esc(it.note) + ' · ' + K.fmt(it.cost, 0) + ' 分/份</div>' +
          '<div style="margin-top:6px;max-width:320px">' + bar(pct) + '</div></div>' +
          '<div class="v">' + (it.kind === 'carbon' ? '−' + K.fmt(it.credit, 2) + ' kg CO₂e' : '生态贡献') +
          '<small>已换 ' + it.count + ' 份</small></div></div>';
      }).join('') + '</div>';

    var simRows = plan.list.map(function (it) {
      return '<tr><td>' + esc(it.name) + '</td><td class="num">' + K.fmt(it.cost, 0) + '</td>' +
        '<td class="num">' + it.count + '</td><td class="num">' + K.fmt(it.spent, 0) + '</td>' +
        '<td class="num">' + (it.kind === 'carbon' ? K.fmt(it.credit, 2) + ' kg' : '—') + '</td></tr>';
    }).join('');

    var formulas = '<ul class="small muted" style="padding-left:18px;line-height:2.1">' +
      '<li><b>单项排放</b> = 用量 × 排放因子 ÷ 1000（tCO₂e）</li>' +

      '<ul style="margin:8px 0 0;padding-left:18px;line-height:2">' +
